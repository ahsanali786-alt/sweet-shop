<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bala Ji Sweets House</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#fff8f0;
}

header{
  background:linear-gradient(45deg,red,orange);
  color:white;
  text-align:center;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}

.card{
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px #ccc;
  text-align:center;
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

button{
  background:green;
  color:white;
  border:none;
  padding:8px;
  margin-top:5px;
  border-radius:5px;
}
</style>
</head>

<body>

<header>
<h1>🍬 Bala Ji Sweets House</h1>
<p>Patedha, Saran, Bihar</p>
</header>

<div class="grid">

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/commons/2/2c/Rasgulla.jpg">
<h3>Rasgulla</h3>
<p>₹200/kg</p>
<a href="https://wa.me/919876543210?text=Hello%20I%20want%20to%20order%20Rasgulla">
<button>Order Now</button>
</a>
</div>

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Gulab_jamun.jpg">
<h3>Gulab Jamun</h3>
<p>₹180/kg</p>
<a href="https://wa.me/919876543210?text=Hello%20I%20want%20to%20order%20Gulab%20Jamun">
<button>Order Now</button>
</a>
</div>

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Kaju_katli.jpg">
<h3>Kaju Katli</h3>
<p>₹800/kg</p>
<a href="https://wa.me/919876543210?text=Hello%20I%20want%20to%20order%20Kaju%20Katli">
<button>Order Now</button>
</a>
</div>

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Laddu.jpg">
<h3>Laddu</h3>
<p>₹150/kg</p>
<a href="https://wa.me/919876543210?text=Hello%20I%20want%20to%20order%20Laddu">
<button>Order Now</button>
</a>
</div>

</div>

</body>
</html>
