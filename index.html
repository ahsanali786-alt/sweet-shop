<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Sweets Shop</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
}

header {
  background: linear-gradient(45deg, #8b0000, #ff4d4d);
  color: white;
  text-align: center;
  padding: 20px;
}

nav {
  background: #222;
  text-align: center;
  padding: 10px;
}

nav a {
  color: white;
  margin: 10px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  padding: 15px;
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

button {
  background: green;
  color: white;
  border: none;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  cursor: pointer;
}

footer {
  background: black;
  color: white;
  text-align: center;
  padding: 15px;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <h1>🍬 Bala Ji Sweets House</h1>
  <p>Fresh | Pure | Delicious</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Menu</a>
  <a href="#">Contact</a>
</nav>

<div class="container">
  <h2 style="text-align:center;">Our Special Sweets</h2>

  <div class="grid">

    <div class="card">
      <img src="https://source.unsplash.com/300x200/?rasgulla">
      <h3>Rasgulla</h3>
      <p>₹200/kg</p>
      <button onclick="order('Rasgulla')">Order Now</button>
    </div>

    <div class="card">
      <img src="https://source.unsplash.com/300x200/?gulabjamun">
      <h3>Gulab Jamun</h3>
      <p>₹180/kg</p>
      <button onclick="order('Gulab Jamun')">Order Now</button>
    </div>

    <div class="card">
      <img src="https://source.unsplash.com/300x200/?kaju-katli">
      <h3>Kaju Katli</h3>
      <p>₹800/kg</p>
      <button onclick="order('Kaju Katli')">Order Now</button>
    </div>

    <div class="card">
      <img src="https://source.unsplash.com/300x200/?laddu">
      <h3>Laddu</h3>
      <p>₹150/kg</p>
      <button onclick="order('Laddu')">Order Now</button>
    </div>

  </div>
</div>

<footer>
  <p>📞 Contact: 8676989879</p>
  <p>📍 Location: Patedha, Saran, Bihar - 841442</p>
  <p>🚚 Home Delivery Available</p>
</footer>

<script>
function order(item){
  let phone = "918676989879"; // 👈 apna number daalo
  let msg = "Hello, I want to order " + item;
  let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
  window.open(url, '_blank');
}
</script>

</body>
</html>
